syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.github.angelogalvao.example.ai.frauddetection.model";

package fraud;

service FraudDetection {
  rpc predict (TxDetails) returns (FraudRes) {}
}

message TxDetails {
  string tx_id = 1;
  float distance_from_last_transaction = 2;
  float ratio_to_median_price = 3;
  bool used_chip =4;
  bool used_pin_number = 5;
  bool online_order = 6;
}

message FraudRes {
  string tx_id = 1;
  bool fraud = 2;
}